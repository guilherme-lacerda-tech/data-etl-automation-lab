[project]
name = "data-etl-automation-lab"
version = "0.3.0"
description = "Synthetic ETL automation lab with CSV, JSON, PostgreSQL, SQLAlchemy, reports and manifests."
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1,<4.0",
    "sqlalchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=7.0,<8.0",
    "ruff>=0.16,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["data_etl_automation_lab"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E402", "E501"]
