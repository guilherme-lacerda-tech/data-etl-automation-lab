[project]
name = "data-etl-automation-lab"
version = "0.2.0"
description = "Synthetic ETL automation lab with CSV, JSON, PostgreSQL, SQLAlchemy, reports and manifests."
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1,<4.0",
    "sqlalchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
